spring:
  application:
    name: gesta
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gesta}
    username: ${DB_USERNAME:gesta}
    password: ${DB_PASSWORD:gesta}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    liquibase-schema: public

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
