name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  back:
    name: Back-end (build et tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: gesta_test
          POSTGRES_USER: gesta
          POSTGRES_PASSWORD: gesta
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gesta -d gesta_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build et tests
        run: ./mvnw -B -ntp verify -Dskip.installnodenpm -Dskip.npm

  front:
    name: Front-end (lint et build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build