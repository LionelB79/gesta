services:
  postgres:
    image: postgres:18-alpine
    container_name: gesta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gesta
      POSTGRES_USER: gesta
      POSTGRES_PASSWORD: gesta
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gesta -d gesta" ]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    container_name: gesta-app
    profiles: [ "app" ]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/gesta
      DB_USERNAME: gesta
      DB_PASSWORD: gesta
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  minio:
    image: minio/minio:latest
    container_name: gesta-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gesta-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gesta.fr
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"  #http://localhost:5050
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
